appId: com.xueersi.ai-textbook
productName: AI教材工作台
copyright: Copyright © 2026

electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json
  # 服务端依赖在 extraResources/app 里自带；asar 只放壳，避免把 Next/React 再打一遍
  - "!node_modules/**/*"

extraResources:
  # Next standalone：server.js + 最小 node_modules
  - from: .next/standalone
    to: app
  # 随包规则/知识库基线；排除开发机上可能存在的 OCR 缓存
  - from: resources
    to: .
    filter:
      - "**/*"
      - "!ocr/**"
  # 由 scripts/stage-knowledge-collections.mjs 从工作区整理出的精简范本集合
  - from: build/knowledge-collections
    to: knowledge/collections
    filter:
      - "**/*"
  # 便携 Python + MinerU + pipeline 模型（由 scripts/build-ocr-runtime.ps1 生成）
  - from: build/ocr
    to: ocr
    filter:
      - "**/*"

asar: true
npmRebuild: false
compression: normal
afterPack: build/after-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  # 无签名证书时默认会下载 winCodeSign 去改 exe 资源；内网构建无法访问 GitHub。
  # 关掉后不影响安装和运行，只跳过 exe 图标/版本资源的写入。
  signAndEditExecutable: false
  icon: build/icon.png
  artifactName: "AI教材工作台-Setup-${version}.${ext}"

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: "AI教材工作台-Setup-${version}.${ext}"
